<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="width: 400px;">
    <h3 class="text-center">Login</h3>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" formControlName="email" placeholder="Enter your registered email" required />
        <div *ngIf="email?.invalid && email?.touched" class="text-danger">
          <span *ngIf="email?.errors?.['required']">Email is required.</span>
          <span *ngIf="email?.errors?.['email']">Invalid email format.</span>
        </div>
      </div>

      <div class="mb-3 position-relative">
        <label for="password" class="form-label">Password</label>
        <input [type]="hidePassword ? 'password' : 'text'" id="password" class="form-control" placeholder="Enter your password" formControlName="password" required />
        <!-- <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2" (click)="togglePasswordVisibility()">
          <i class="bi" [ngClass]="{'bi-eye-slash': hidePassword, 'bi-eye': !hidePassword}"></i>
        </button> -->
        <div *ngIf="password?.invalid && password?.touched" class="text-danger">
          <span *ngIf="password?.errors?.['required']">Password is required.</span>
          <span *ngIf="password?.errors?.['minlength']">Minimum 6 characters required.</span>
        </div>
      </div>

      <button type="submit" name="login" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Login</button>

      <!-- New User? Signup Link -->
      <div class="mt-3 text-center">
        <p class="text-muted">New user? <a routerLink="/signup" class="text-primary">Please register</a></p>
      </div>
    </form>
  </div>
</div>
