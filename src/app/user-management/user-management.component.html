<div class="user-management-container">
  <h2>User Management</h2>

  <table mat-table [dataSource]="users()" class="mat-elevation-z8">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let user">{{ user.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let user">
        <mat-select [value]="user.role" (selectionChange)="changeRole(user.id, $event.value)"
          [panelClass]="'role-dropdown-panel'" [disableRipple]="true" [disabled]="!isAdmin()">
          <mat-option value="Admin">Admin</mat-option>
          <mat-option value="User">User</mat-option>
        </mat-select>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['name', 'email', 'role']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['name', 'email', 'role']"></tr>
  </table>
</div>
