<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="signup-container p-4 border rounded shadow-sm">
        <h2 class="text-center mb-4">Sign Up</h2>
        <form [formGroup]="signupForm" (ngSubmit)="signup()">

          <!-- Username -->
          <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input type="text" class="form-control" formControlName="username" id="username" placeholder="Enter username" />
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" formControlName="email" id="email" placeholder="Enter your email" />
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" class="form-control" formControlName="password" id="password" placeholder="Enter password" />
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password:</label>
            <input type="password" class="form-control" formControlName="confirmPassword" id="confirmPassword" placeholder="Confirm password" />
            <small *ngIf="signupForm.hasError('passwordsMismatch')" class="text-danger">Passwords do not match</small>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100" [disabled]="signupForm.invalid">Sign Up</button>

          <div class="mt-3 text-center">
            <p class="text-muted">Already user? <a routerLink="/login" class="text-primary">Please login</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
